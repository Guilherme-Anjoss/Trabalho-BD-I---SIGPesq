services:
  mysql-sigpesq:
    image: mysql:8.4
    container_name: sigpesq_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sigpesq_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro

volumes:
  mysql_data: