<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGPesq - Gestão de Projetos de Pesquisa</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <aside>
    <div class="marca">
      <div class="logo">SP</div>
      <div>
        <h1>SIGPesq</h1>
        <small>UFNES · Gestão de pesquisa</small>
      </div>
    </div>
    <nav id="menu">
      <a href="#visao" data-pagina="visao">Visão geral</a>
      <span class="grupo">Pesquisa</span>
      <a href="#projetos" data-pagina="projetos">Projetos</a>
      <a href="#participantes" data-pagina="participantes">Participantes</a>
      <a href="#vinculos" data-pagina="vinculos">Vínculos</a>
      <a href="#producoes" data-pagina="producoes">Produções científicas</a>
      <span class="grupo">Fomento</span>
      <a href="#agencias" data-pagina="agencias">Agências de fomento</a>
      <a href="#financiamentos" data-pagina="financiamentos">Financiamentos</a>
      <a href="#alocacoes" data-pagina="alocacoes">Alocações de recursos</a>
      <span class="grupo">Consultas</span>
      <a href="#relatorios" data-pagina="relatorios">Relatórios</a>
    </nav>
  </aside>

  <main>
    <header>
      <div>
        <h2 id="titulo"></h2>
        <small id="subtitulo"></small>
      </div>
      <button class="primario" id="novo" hidden></button>
    </header>
    <section id="conteudo"></section>
  </main>

  <!-- Janela unica, reaproveitada por todos os formularios -->
  <dialog id="dlg">
    <form id="form" novalidate>
      <h3 id="form-titulo"></h3>
      <div id="campos"></div>
      <div id="erro" role="alert"></div>
      <div class="acoes">
        <button type="button" class="secundario" id="cancelar">Cancelar</button>
        <button type="submit" class="primario" id="salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <div id="avisos" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
